# The site on the projects server. Ports 80/443 belong to the shared Caddy
# from aimuzov-projects/infra-server, it proxies the domain here over the edge network.

name: __PROJECT__

x-logging: &logging
  driver: json-file
  options:
    max-size: '5m'
    max-file: '2'

services:
  site:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      secrets: [env]
    image: __PROJECT__
    container_name: __PROJECT__
    restart: unless-stopped
    networks:
      - edge
    logging: *logging

# Build variables live in /srv/__PROJECT__/.env, the sample is .env.example.
secrets:
  env:
    file: ../.env

networks:
  edge:
    name: edge
    external: true
