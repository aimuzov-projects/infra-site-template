name: Check

# На main эти проверки вызывает workflow деплоя перед выкаткой,
# поэтому отдельный прогон там был бы дублем.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: aimuzov-projects/infra-site-kit/check@v1
      # e2e from infra-site-kit: the build in Chromium. The browser is cached by the Playwright
      # version, its system libraries come from apt every run.
      - id: playwright
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
