name: Check

# На main эти проверки вызывает workflow деплоя перед выкаткой,
# поэтому отдельный прогон там был бы дублем.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: aimuzov-projects/infra-site-kit/check@v1
