name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys run one by one, a new one doesn't abort a build that has already started.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # Until the server is ready (key, clone in /srv, site in Caddy), the deploy is skipped.
  # It's enabled by the repo variable DEPLOY_ENABLED=true,
  # which infra-template-site itself doesn't have.
  deploy:
    needs: check
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://__DOMAIN__
    steps:
      - uses: aimuzov-projects/site-kit/deploy@v1
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://__DOMAIN__
